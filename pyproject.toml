[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "sivr-research"
version = "0.1.0"
description = "Structure-informed brain-visual-linguistic category decoding research artifacts"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
